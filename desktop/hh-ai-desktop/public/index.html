<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <title>HH Ai — подготовка</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family: system-ui, Segoe UI, sans-serif;
        line-height: 1.5;
      }
      body {
        max-width: 42rem;
        margin: 3rem auto;
        padding: 0 1.25rem;
      }
      code {
        background: rgba(127, 127, 127, 0.15);
        padding: 0.1em 0.35em;
        border-radius: 4px;
      }
      button {
        font: inherit;
        padding: 0.5rem 1rem;
        cursor: pointer;
        margin-right: 0.5rem;
      }
      button:disabled {
        opacity: 0.6;
        cursor: wait;
      }
      #status,
      #chromium-status {
        margin: 1rem 0;
        padding: 0.75rem 1rem;
        border-radius: 8px;
        background: rgba(127, 127, 127, 0.12);
      }
      .section {
        margin-top: 2rem;
        padding-top: 1rem;
        border-top: 1px solid rgba(127, 127, 127, 0.25);
      }
    </style>
  </head>
  <body>
    <h1>HH Ai</h1>
    <p>Локальный дашборд: <code id="port-label">127.0.0.1:3849</code></p>
    <div id="status">Запускаем дашборд…</div>
    <p>
      <button type="button" id="retry">Повторить подключение</button>
      <a id="open-link" href="http://127.0.0.1:3849/">Открыть в браузере</a>
    </p>

    <div class="section">
      <h2>Chromium для откликов</h2>
      <div id="chromium-status">Проверка…</div>
      <p>Нужен для <code>npm run login</code> и автоматических откликов (~200 МБ).</p>
      <button type="button" id="install-chromium" hidden>Установить Chromium</button>
    </div>

    <script>
      const port = 3849;
      const statusEl = document.getElementById('status');
      const chromiumStatusEl = document.getElementById('chromium-status');
      const retryBtn = document.getElementById('retry');
      const installBtn = document.getElementById('install-chromium');
      const openLink = document.getElementById('open-link');
      const portLabel = document.getElementById('port-label');
      const dashboardUrl = `http://127.0.0.1:${port}/`;
      const tauri = () => window.__TAURI_INTERNALS__?.invoke;

      portLabel.textContent = `127.0.0.1:${port}`;
      openLink.href = dashboardUrl;

      async function probeDashboard() {
        if (tauri()) {
          try {
            await tauri()('start_dashboard_sidecar');
            const up = await tauri()('check_dashboard');
            if (up) {
              const opened = await tauri()('open_dashboard');
              if (opened) return true;
            }
          } catch {
            /* fallback */
          }
        }
        try {
          const r = await fetch(dashboardUrl, { cache: 'no-store' });
          if (r.ok) {
            window.location.href = dashboardUrl;
            return true;
          }
        } catch {
          /* still down */
        }
        return false;
      }

      async function refreshDashboardStatus() {
        statusEl.textContent = 'Проверка дашборда…';
        const up = await probeDashboard();
        statusEl.textContent = up
          ? 'Дашборд найден, переключаем…'
          : 'Дашборд не отвечает. Tauri попробует sidecar или запустите npm run dashboard.';
      }

      async function refreshChromiumStatus() {
        if (tauri()) {
          try {
            const installed = await tauri()('check_chromium');
            if (installed) {
              chromiumStatusEl.textContent = 'Chromium установлен.';
              installBtn.hidden = true;
              return;
            }
            chromiumStatusEl.textContent = 'Chromium не установлен — нужен для login/apply.';
            installBtn.hidden = false;
            return;
          } catch {
            /* fallback */
          }
        }
        chromiumStatusEl.textContent =
          'Проверка через Tauri недоступна. В терминале: npx playwright install chromium';
        installBtn.hidden = true;
      }

      installBtn.addEventListener('click', async () => {
        if (!tauri()) return;
        installBtn.disabled = true;
        retryBtn.disabled = true;
        chromiumStatusEl.textContent = 'Установка Chromium… (1–3 мин, ~200 МБ)';
        try {
          await tauri()('install_chromium');
          chromiumStatusEl.textContent = 'Chromium установлен.';
          installBtn.hidden = true;
        } catch (e) {
          chromiumStatusEl.textContent = `Ошибка: ${e}`;
          installBtn.hidden = false;
        } finally {
          installBtn.disabled = false;
          retryBtn.disabled = false;
        }
      });

      retryBtn.addEventListener('click', refreshDashboardStatus);
      refreshDashboardStatus();
      refreshChromiumStatus();
      setInterval(refreshDashboardStatus, 5000);
    </script>
  </body>
</html>
