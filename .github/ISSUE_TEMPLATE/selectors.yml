name: Селекторы hh.ru
description: Сломалась вёрстка — отклик, форма, чат, анкета
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Файлы селекторов: `lib/hh-response-selectors.mjs`, `lib/hh-chat-selectors.mjs`.
        Обновление: `npm run codegen-hh` на живой странице hh.ru.
  - type: input
    id: page
    attributes:
      label: Страница / сценарий
      placeholder: "батч отклик / форма письма / чат / анкета"
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: Что не находит Playwright
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Шаги воспроизведения
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Версия (VERSION)
      placeholder: "2.0.0"
  - type: textarea
    id: logs
    attributes:
      label: Лог / скрин (без PII)
      description: data/hh-apply-chat.log или hh-apply-chat-error-*.png — без cookies и ключей
