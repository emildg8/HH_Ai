# Ветка wispbyte-bot — только Python webhook для Wispbyte (без монорепо).
name: Sync Wispbyte bot branch

on:
  push:
    branches: [main, HH_Ai, master]
    paths:
      - 'deploy/vdsina/**'
      - 'scripts/sync-wispbyte-bot-branch.mjs'
      - '.github/workflows/sync-wispbyte-bot.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build bot-only tree
        run: |
          mkdir bot-export
          cp -r deploy/vdsina/app bot-export/
          cp deploy/vdsina/requirements.txt bot-export/
          cat > bot-export/README.md <<'EOF'
          # HH Ai — Telegram bot (Wispbyte only)
          Startup: pip install -r requirements.txt && python -m uvicorn app.main:app --host 0.0.0.0 --port ${PORT:-8080}
          EOF
          echo 'data/' > bot-export/.gitignore
          echo '.env' >> bot-export/.gitignore

      - name: Push wispbyte-bot branch
        working-directory: bot-export
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git init
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "sync from ${GITHUB_SHA::7}"
          git branch -M wispbyte-bot
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git"
          git push origin wispbyte-bot --force
