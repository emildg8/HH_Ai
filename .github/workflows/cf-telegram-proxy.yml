# Бесплатный прокси Bot API на Cloudflare Workers (deploy из GitHub, без SSH).
# Secrets: CLOUDFLARE_API_TOKEN (обяз.), CLOUDFLARE_ACCOUNT_ID (если wrangler не определит).
#
# Actions → Deploy CF Telegram proxy → Run workflow

name: Deploy CF Telegram proxy

on:
  workflow_dispatch:
  push:
    branches: [main, HH_Ai, master]
    paths:
      - 'deploy/cf-telegram-proxy/**'
      - '.github/workflows/cf-telegram-proxy.yml'

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install wrangler
        run: npm install -g wrangler@4

      - name: Unique worker name
        id: meta
        run: |
          SUFFIX=$(echo -n "${{ github.repository }}" | sha256sum | cut -c1-8)
          echo "name=hh-ai-tg-${SUFFIX}" >> "$GITHUB_OUTPUT"
          sed -i "s/^name = .*/name = \"hh-ai-tg-${SUFFIX}\"/" deploy/cf-telegram-proxy/wrangler.toml

      - name: Cloudflare account id
        id: cf
        working-directory: deploy/cf-telegram-proxy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -e
          WHO=$(wrangler whoami 2>&1)
          echo "$WHO"
          ACCOUNT="${CLOUDFLARE_ACCOUNT_ID}"
          if [ -z "$ACCOUNT" ]; then
            ACCOUNT=$(echo "$WHO" | grep -oE '[0-9a-f]{32}' | head -1)
          fi
          if [ -z "$ACCOUNT" ]; then
            echo "Не удалось определить CLOUDFLARE_ACCOUNT_ID — добавьте secret в GitHub"
            exit 1
          fi
          echo "account=$ACCOUNT" >> "$GITHUB_OUTPUT"

      - name: Deploy worker
        id: deploy
        working-directory: deploy/cf-telegram-proxy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ steps.cf.outputs.account }}
        run: |
          set -e
          set -o pipefail
          SECRET=$(openssl rand -hex 24)
          wrangler deploy 2>&1 | tee /tmp/wrangler-deploy.log
          printf '%s' "$SECRET" | wrangler secret put PROXY_SECRET
          URL=$(grep -oE 'https://[a-zA-Z0-9._-]+\.workers\.dev' /tmp/wrangler-deploy.log | head -1)
          if [ -z "$URL" ]; then
            echo "wrangler deploy не вернул URL — зарегистрируйте workers.dev subdomain в Cloudflare Dashboard"
            cat /tmp/wrangler-deploy.log
            exit 1
          fi
          echo "base=$URL" >> "$GITHUB_OUTPUT"
          echo "secret=$SECRET" >> "$GITHUB_OUTPUT"

      - name: Summary for .env
        run: |
          {
            echo "## Telegram CF Worker (скопируйте в .env)"
            echo ""
            echo '```env'
            echo "TELEGRAM_API_BASE=${{ steps.deploy.outputs.base }}"
            echo "TELEGRAM_API_SECRET=${{ steps.deploy.outputs.secret }}"
            echo '```'
            echo ""
            echo "Локально: \`npm run telegram:probe-api\` затем \`npm run telegram-bot\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Write config artifact
        run: |
          mkdir -p config
          printf '{\n  "base": "%s",\n  "secret": "%s"\n}\n' \
            "${{ steps.deploy.outputs.base }}" \
            "${{ steps.deploy.outputs.secret }}" \
            > config/telegram-cf-proxy.json

      - uses: actions/upload-artifact@v4
        with:
          name: telegram-cf-proxy-config
          path: config/telegram-cf-proxy.json
          retention-days: 90
