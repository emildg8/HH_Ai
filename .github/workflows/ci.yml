name: CI

on:
  push:
    branches: [main, HH_Ai]
  pull_request:
    branches: [main, HH_Ai]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - run: npm ci
      - run: npx playwright install chromium --with-deps

      - name: Syntax check scripts
        run: |
          for f in scripts/*.mjs lib/*.mjs; do
            node --check "$f"
          done
          node scripts/check-dashboard-modules.mjs

      - name: Quality tests (letters, targeting, baseline)
        run: npm run test:ci-quality

      - name: Golden regression (targeting + letters)
        run: npm run audit:quality-golden

      - name: verify:local (export + PII, без дашборда)
        run: npm run verify:local

      - name: smoke:release (export zip-срез + npm install)
        run: npm run smoke:release

      - name: QA clean install (A+B, skip playwright reinstall)
        run: npm run qa:clean-install -- --skip-playwright
        timeout-minutes: 15

      - name: Desktop smoke (sidecar + chromium check)
        run: npm run desktop:smoke

      - name: Gate B (demo activation)
        run: npm run gate-b

      - name: Dashboard UI smoke
        run: |
          cp dashboard/public/local-dashboard-defaults.example.mjs dashboard/public/local-dashboard-defaults.mjs
          node scripts/dashboard-server.mjs --queue-file=./docs/demo/vacancies-demo.json &
          SERVER_PID=$!
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:3849/ >/dev/null && break
            sleep 1
          done
          npm run devops:test-dashboard-ui
          npm run test:dashboard-settings
          npm run test:chat-inbox-ui
          npm run test:dashboard-a11y
          kill $SERVER_PID 2>/dev/null || true
        env:
          HH_VACANCIES_QUEUE_FILE: ./docs/demo/vacancies-demo.json

      - name: Dashboard screenshot regression (DS-07)
        run: npm run test:dashboard-screenshots
