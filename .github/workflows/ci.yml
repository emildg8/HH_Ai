name: CI

on:
  push:
    branches: [main, HH_Ai]
  pull_request:
    branches: [main, HH_Ai]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - run: npm ci
      - run: npx playwright install chromium --with-deps

      - name: Syntax check scripts
        run: |
          for f in scripts/*.mjs lib/*.mjs; do
            node --check "$f"
          done

      - name: verify:local (export + PII, без дашборда)
        run: npm run verify:local

      - name: Public export path safety
        run: npm run test:public-export-path

      - name: smoke:release (export zip-срез + npm install)
        run: npm run smoke:release

      - name: Dashboard UI smoke
        run: npm run devops:test-dashboard-ui
        env:
          HH_VACANCIES_QUEUE_FILE: ./data/vacancies-queue.example.json
